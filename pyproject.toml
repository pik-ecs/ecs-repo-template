[project]
name = "ecs-repo-template"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "jinja2>=3.1",
    "mkdocs-material>=9.7.7",
    # Exact pin: must match the rev generated projects pin in
    # template/.pre-commit-config.yaml.jinja, or the canonical form differs per side.
    "pyproject-fmt==2.27.0",
]

# This repo lints with everything (a superset of the group standard that generated
# projects get from template/pyproject.toml.jinja.src), so nothing shipped can ever
# trip a generated project's own hooks.
[tool.ruff]
lint.select = ["ALL"]
lint.ignore = [
  "COM812", # conflict with ruff-format
  "ISC001", # conflict with ruff-format
  "D203",   # incompatible with default D211
  "D213",   # incompatible with default D212
  "INP",    # the template ships standalone scripts, not packages
  "S603",   # subprocess without a shell; the shipped scripts run CLIs by design
  "S607",   # subprocess with a partial path; PATH lookup of git/gh/dvc is intended
  "T201",   # print: these scripts are CLI tools that talk to the user
]

[tool.ruff.lint.per-file-ignores]
# Jinja placeholder dir names and the empty package init shipped to projects.
"template/src/**" = ["N999", "D104"]

[tool.uv]
required-version = ">=0.13.6"
exclude-newer = "P5D"