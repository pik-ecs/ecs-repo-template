repos:
  # template/pyproject.toml.jinja carries structural Jinja, so it is no longer parseable
  # TOML in this repo; the guarantee moved to the rendered output (must be pyproject-fmt
  # canonical, or copier updates merge-conflict on untouched projects).
  - repo: local
    hooks:
      - id: check-render
        name: render check (template pyproject is pyproject-fmt canonical)
        entry: uv run scripts/check_render.py
        language: system
        always_run: true
        pass_filenames: false

  # Lints all Python here with the [tool.ruff] config in the root pyproject.toml —
  # the same discovery generated projects use, so shipped scripts can never break a
  # project's first commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2700fd5671c633760d912769c041bfcde2b9a01b # v0.15.22
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
