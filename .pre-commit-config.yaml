repos:
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "b82a24a520c5d496cb7b23b4e9b63537c280f51b" #v2.27.0
    hooks:
      - id: pyproject-fmt
        files: ^template/pyproject\.toml\.jinja\.src$
        exclude: ^template/scripts

  # Lints all Python here with the [tool.ruff] config in the root pyproject.toml —
  # the same discovery generated projects use, so shipped scripts can never break a
  # project's first commit.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 2700fd5671c633760d912769c041bfcde2b9a01b # v0.15.22
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
