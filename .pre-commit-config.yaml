repos:
  # template/pyproject.toml.jinja carries structural Jinja, so it is no longer parseable
  # TOML in this repo; the guarantee moved to the rendered output (must be pyproject-fmt
  # canonical, or copier updates merge-conflict on untouched projects).
  - repo: local
    hooks:
      - id: check-render
        name: render check (fmt-canonical render, root/template pin parity)
        entry: uv run scripts/check_render.py
        language: system
        always_run: true
        pass_filenames: false

  # Lints all Python here with the [tool.ruff] config in the root pyproject.toml —
  # the same discovery generated projects use, so shipped scripts can never break a
  # project's first commit.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: no-commit-to-branch
