projectname:
  type: str
  help: What is your project name

packagename:
  type: str
  when: false
  default: "{{ _copier_answers.projectname | lower | replace('-', '_') | replace(' ', '_') }}"
  validator: "{% if not packagename.isidentifier() %}Project name '{{ projectname }}' normalises to '{{ packagename }}', which is not a valid Python identifier; start the project name with a letter.{% endif %}"

project_description:
  type: str

python_version:
  type: str
  help: "Which minimum Python version should this project target. (Select the most recent for highest performance and access to features, or earlier versions if you want your code to be runnable by a wider audience)."
  default: "3.14"
  choices:
    - "3.11"
    - "3.12"
    - "3.13"
    - "3.14"

use_dvc:
  type: bool
  help: "Do you want to use dvc to version control data using the ECS shared drive?"
  default: true

dvc_ts01_remote_path:
  type: str
  default: "/data/rd5/ecs/DVC/{{ _copier_answers.projectname }}"
  when: "{{ use_dvc }}"
  validator: "{% if not dvc_ts01_remote_path|length %}DVC path cannot be empty {% elif dvc_ts01_remote_path|regex_search('^/data/rd5/ecs/DVC/?$') %}Cannot use the group DVC root path{% elif dvc_ts01_remote_path == '/' %}DVC path cannot be root{% endif %}"
  help: "Remote path on ts01 for storing DVC cache files"

dvc_ts01_user:
  type: str
  default: ""
  when: "{{ use_dvc }}"
  help: "SSH username for ts01 (leave blank to use current system user)"

use_vscode:
  type: bool
  help: "Do you use VSCode? (if yes write standard config)"
  default: true

_subdirectory: template

_exclude:
  - "{% if not use_vscode %}.vscode{% endif %}"
  - "{% if not use_dvc %}hooks/check_dvc_pushed.py{% endif %}"

_tasks:
  - git init
  - uv sync
  - uvx prek install
  - |-
      {% if use_dvc %}
      uv add "dvc[ssh]"
      test -d .dvc || uv run dvc init --no-scm
      uv run dvc config core.analytics false
      uv run dvc remote add -d -f ts01 "ssh://ts01.pik-potsdam.de{{ dvc_ts01_remote_path }}"
      {% if dvc_ts01_user %}
      uv run dvc remote modify --local ts01 user {{ dvc_ts01_user }}
      {% endif %}
      {% endif %}
  - git add -A
  - uvx prek run --all-files || true
  - git add -A

_message_after_copy: |
  🎉 Project initialized successfully!

  Next steps:
    cd {{ _copier_answers._folder_name | default('.', true) }}
    code .                     # Open in VS Code
    git add -A                 # Review staged files
    uvx prek run --all-files  # Run pre-commit
    git commit -m "chore: initial commit from ecs-repo-template"

  Optional: protect main (on GitHub, and a local pre-commit guard against
  committing on main by accident):
    uv run .github/rulesets/protect.py
  (what that does: https://pik-ecs.github.io/ecs-repo-template/choices/branch-protection/)

  {% if use_dvc %}
  📦 DVC Storage Configured:
    - Default remote: ts01
    - Make sure that /data/rd5/ecs/DVC/{{ dvc_ts01_remote_path }} on ts01
  {% endif %}
